{% extends 'base.html' %}

{% block title %}Edit Tenant - EasyRent{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-center mb-4 fw-bold">Edit Tenant</h2>
    <form id="tenantForm" method="post" action="{% url 'edit_tenant' tenant.id %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="tenant_name" class="form-label">Tenant Name:</label>
            <input type="text" id="tenant_name" name="name" class="form-control" value="{{ tenant.name }}" required>
        </div>
        <div class="mb-3">
            <label for="tenant_phone" class="form-label">Tenant Phone:</label>
            <input type="text" id="tenant_phone" name="phone" class="form-control" value="{{ tenant.phone }}" required>
        </div>
        <div class="mb-3">
            <label for="property_name" class="form-label">Property Name:</label>
            <input type="text" id="property_name" name="property_name" class="form-control" value="{{ tenant.property_name }}" required>
        </div>
        <div class="mb-3">
            <label for="unit_occupied" class="form-label">Unit Occupied:</label>
            <input type="text" id="unit_occupied" name="unit" class="form-control" value="{{ tenant.unit }}" required>
        </div>
        <div class="mb-3">
            <label for="date_occupied" class="form-label">Date Occupied:</label>
            <input type="date" id="date_occupied" name="date_occupied" class="form-control" value="{{ tenant.date_occupied }}" required>
        </div>
        <div class="mb-3">
            <label for="rent_paid" class="form-label">Rent Paid:</label>
            <input type="number" id="rent_paid" name="rent_paid" class="form-control" value="{{ tenant.rent_paid }}" required>
        </div>
        <div class="mb-3">
            <label for="date_paid" class="form-label">Date Paid:</label>
            <input type="date" id="date_paid" name="date_paid" class="form-control" value="{{ tenant.date_paid }}" required>
        </div>
        <div class="mb-3">
            <label for="month_paid_for" class="form-label">Month Paid For:</label>
            <select id="month_paid_for" name="month_paid_for" class="form-control" required>
                {% for value, display in form.month_paid_for.field.choices %}
                    <option value="{{ value }}" {% if value == tenant.month_paid_for %}selected{% endif %}>{{ display }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="monthly_rent" class="form-label">Monthly Rent:</label>
            <input type="number" id="monthly_rent" name="monthly_rent" class="form-control" value="{{ tenant.monthly_rent }}" required>
        </div>
        <div class="mb-3">
            <label for="rent_balance" class="form-label">Rent Balance:</label>
            <input type="number" id="rent_balance" name="rent_balance" class="form-control" value="{{ tenant.rent_balance }}" readonly>
        </div>
        <div class="mb-3">
            <label for="total_rent_balance" class="form-label">Total Rent Balance:</label>
            <input type="number" id="total_rent_balance" name="total_rent_balance" class="form-control" value="{{ tenant.cumulative_rent_balance }}" readonly>
        </div>
        <button type="submit" class="btn btn-primary">Update Tenant</button>
    </form>
</div>

<script>
    document.getElementById('tenantForm').addEventListener('input', function() {
        var monthlyRent = parseFloat(document.getElementById('monthly_rent').value) || 0;
        var rentPaid = parseFloat(document.getElementById('rent_paid').value) || 0;
        var rentBalance = monthlyRent - rentPaid;
        document.getElementById('rent_balance').value = rentBalance;

        // Calculate the new cumulative rent balance
        var initialCumulativeRentBalance = parseFloat(document.getElementById('total_rent_balance').dataset.initialValue) || 0;
        var initialRentBalance = parseFloat(document.getElementById('rent_balance').dataset.initialValue) || 0;
        var newCumulativeRentBalance = initialCumulativeRentBalance - initialRentBalance + rentBalance;
        document.getElementById('total_rent_balance').value = newCumulativeRentBalance;
    });

    // Store initial values for cumulative rent balance calculation
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('total_rent_balance').dataset.initialValue = document.getElementById('total_rent_balance').value;
        document.getElementById('rent_balance').dataset.initialValue = document.getElementById('rent_balance').value;
    });
</script>
{% endblock %}
