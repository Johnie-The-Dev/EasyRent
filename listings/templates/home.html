{% extends "base.html" %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #4A90E2, #50C9C3);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .welcome-container {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    .hero-ctas { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .hero-ctas .btn { padding: 10px 18px; font-size: 16px; border-radius: 8px; }
    .hero-ctas .btn:hover { transform: translateY(-3px); }
</style>

<div class="container d-flex justify-content-center">
    <div class="welcome-container">
        <h1 class="fw-bold text-primary">Welcome to EasyRent</h1>
        <p class="lead text-secondary">Find your perfect home with ease.</p>

        <!-- Navigation Links -->
        <div class="mt-4 hero-ctas">
            {% if user.is_authenticated %}
                {% if user.is_landlord %}
                    <a href="{% url 'landlord_dashboard' %}" class="btn btn-primary btn-lg">Go to Dashboard</a>
                {% else %}
                    <a href="{% url 'tenant_feed' %}" class="btn btn-primary btn-lg">Browse Properties</a>
                    <a href="{% url 'view_collection' %}" class="btn btn-outline-secondary btn-lg">My Collection</a>

                {% endif %}
                <!-- logout in navbar; removed here to avoid duplicate CTA -->
            {% else %}
                <a href="{% url 'signup' %}" class="btn btn-success btn-lg">Sign Up</a>
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-lg">Login</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
