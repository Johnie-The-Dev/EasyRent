<div data-unit-formset-controls data-prefix="{{ unit_formset.prefix }}">
  <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <span class="text-muted small">Add as many units as this property needs. Each unit can have its own type, price, and deposit.</span>
    <button type="button" class="btn btn-outline-primary btn-sm" data-add-unit>
      <i class="bi bi-plus-circle"></i> Add another unit
    </button>
  </div>

  <template data-empty-unit-form>
    {% include "listings/_unit_form.html" with uf=unit_formset.empty_form %}
  </template>

  <script>
    (() => {
      const formsetRoot = document.currentScript.parentElement;
      const container = document.getElementById("unit-formset-forms");
      const totalForms = document.getElementById(`id_${formsetRoot.dataset.prefix}-TOTAL_FORMS`);
      const addButton = formsetRoot.querySelector("[data-add-unit]");
      const template = formsetRoot.querySelector("[data-empty-unit-form]");

      addButton.addEventListener("click", () => {
        const index = Number(totalForms.value);
        const markup = template.innerHTML.replaceAll("__prefix__", String(index));
        container.insertAdjacentHTML("beforeend", markup);
        totalForms.value = String(index + 1);
        container.lastElementChild.querySelector("input:not([type=hidden]), select")?.focus();
      });

      container.addEventListener("change", (event) => {
        if (event.target.name?.endsWith("-DELETE")) {
          event.target.closest(".unit-form")?.classList.toggle("opacity-50", event.target.checked);
        }
      });
    })();
  </script>
</div>
